<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="CaeliGlow mark">
  <title>CaeliGlow</title>
  <defs>
    <linearGradient id="cg-arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#4FE0C4"/>
      <stop offset="55%" stop-color="#8B7CF6"/>
      <stop offset="100%" stop-color="#F5C86B"/>
    </linearGradient>
    <radialGradient id="cg-core" cx="50%" cy="45%" r="55%">
      <stop offset="0%"   stop-color="#F5C86B" stop-opacity="0.95"/>
      <stop offset="60%"  stop-color="#8B7CF6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0B1020" stop-opacity="0"/>
    </radialGradient>
    <filter id="cg-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- night plate -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="#0B1020"/>
  <rect x="0" y="0" width="128" height="128" rx="28" fill="none" stroke="#1D2547" stroke-width="2"/>

  <!-- inner glow core -->
  <circle cx="64" cy="60" r="34" fill="url(#cg-core)"/>

  <!-- aurora "C" arc, open on the right -->
  <g filter="url(#cg-glow)">
    <path d="M92 40
             A34 34 0 1 0 92 88"
          fill="none" stroke="url(#cg-arc)" stroke-width="11"
          stroke-linecap="round"/>
  </g>

  <!-- single star accent -->
  <circle cx="93" cy="41" r="6.5" fill="#F5C86B"/>
  <circle cx="93" cy="41" r="6.5" fill="none" stroke="#0B1020" stroke-width="1.5"/>
</svg>
