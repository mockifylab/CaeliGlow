# Minimal nested Hyprland config for testing CaeliGlow v1.3.0.
# This only exists to host the CaeliGlow shell in an isolated window.

general {
    gaps_in = 4
    gaps_out = 8
    layout = dwindle
}

decoration {
    rounding = 8
    blur { enabled = true; size = 4 }
}

input {
    kb_layout = us
    follow_mouse = 1
}

# Launch the patched CaeliGlow shell inside the nested session. NOCTALIA_ASSETS_DIR
# is exported by scripts/caeliglow-nested-session.sh so the animated logo GIF is found.
exec-once = /home/cosmire/Documents/Qoder/2026-10-17/chat-3/upstream/noctalia/build-debug/noctalia

# A couple of keybinds to quit the nested session cleanly (does not touch the host).
bind = CTRL ALT, Q, exit,
