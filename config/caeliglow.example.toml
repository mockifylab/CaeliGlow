# CaeliGlow example configuration
# -------------------------------
# The signature CaeliGlow interactions are enabled by COMPILED-IN DEFAULTS, so a stock
# CaeliGlow build already shows them with no config at all:
#   * Bar hover ............ hovering any bar widget opens its panel (and closes on leave)
#   * Bottom edge .......... hover + dwell reveals the launcher
#   * Right edge ........... hover + dwell opens the CaeliGlow power pill
#   * Settings > About ..... animated branded page with a live update check
#
# Everything below is OPTIONAL tuning. Since 1.4.0 CaeliGlow keeps its configuration in
# its OWN namespace — merge these blocks into CaeliGlow's own config (do NOT replace the
# whole file — keep your bar, theme, widgets).
# With these blocks absent you get the defaults above; override any value to change it.
#
# Where CaeliGlow's config lives (patch 0008):
#   ~/.config/caeliglow/config.toml            (print with: noctalia --print-config-path)
#   ~/.local/state/caeliglow/                  (settings.toml, state.toml, plugin data)
#   override roots with CAELIGLOW_CONFIG_HOME / CAELIGLOW_STATE_HOME / CAELIGLOW_DATA_HOME
# Your ~/.config/noctalia is never read or written by CaeliGlow.

# --- Edge triggers (patches 0002 + 0003 + 0006) --------------------------------------
# Reuse Noctalia's built-in HotCorners dwell mechanism: move the pointer to the edge,
# hold for `delay_ms`, and the action fires. Leaving the strip cancels it.
[hot_corners]
enabled = true          # default: true (CaeliGlow ships its edges on)
delay_ms = 120          # hold time before firing; 0 = trigger immediately on enter
edge_width = 0          # bottom strip width; 0 = auto (~25% of the screen width)
right_edge_width = 0    # right strip thickness; 0 = auto

# NOTE (TOML): all plain key/values for [hot_corners] must appear *before* the first
# [hot_corners.<subtable>] header, otherwise they are parsed into that sub-table.

# Bottom-edge strip reveals the existing Noctalia launcher. (default: "launcher")
[hot_corners.bottom_edge]
action = "launcher"

# Right-edge strip. The CaeliGlow default "caeliglow_power" opens the floating, animated
# right-middle power pill (Logout / Power / logo / Lock / Restart, with confirm
# countdowns). Set action = "power" instead to open Noctalia's native SessionPanel, or
# "none" to disable the right edge.
[hot_corners.right_edge]
action = "caeliglow_power"

# --- Bar hover (patch 0005) -----------------------------------------------------------
# Hover-to-open-panel needs no configuration: it is driven from each widget's own
# left-click gesture (which panel it toggles), so it automatically covers built-in,
# user-added and plugin widgets, and stays inert for per-item widgets (workspaces,
# taskbar, tray). Set a widget's left-click gesture to something that is not a panel
# toggle if you want hover to do nothing for that widget.

# --- Original power buttons ------------------------------------------------------------
# Patch 0003 hides the duplicate power entries in the Control Center header and the
# Launcher toolbar, since session actions now live on the right edge. To bring either
# one back, set it explicitly to `true`:
#
# [control_center]
# show_session_button = true
# [shell.launcher]
# show_session_button = true

# --- CaeliGlow motion & docking (patch 0011–0013) ---------------------------------------
# Everything in this block is also editable in the shell: Settings > CaeliGlow.
# Values shown are the compiled-in defaults; uncomment and change what you like.
#
# [caeliglow]
# motion = "fizzy"          # panel open animation: "classic" | "soft" | "fizzy" | "morphy"
#                           # (fizzy/morphy are elastic spring styles with a squash-and-stretch
#                           #  pulse; classic/soft keep linear-style easing / gentle overshoot)
# duration_ms = 420         # open animation duration, 80–1500 ms (close is ~60% of it)
# elasticity = 0.55         # spring strength for fizzy/morphy, 0.0–1.0
# hover_open = true         # hovering a bar widget opens its panel
# power_edge = "right"      # which screen edge the power pill docks to: "left" | "right"
